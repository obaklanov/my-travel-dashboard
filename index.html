<!DOCTYPE html>
<html>

<head>
    <title>My Travel Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>My Travel Dashboard</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a> </li>
            <li><a href="vietnam.html">Vietnam</a> </li>
            <li><a href="thailand.html">Thailand</a> </li>
            <li><a href="indonesia.html">Indonesia</a> </li>
            <li><a href="malaysia.html">Malaysia</a> </li>
        </ul>
    </nav>
    <main>
        <section class="hero">
            <h2>Explore the World</h2>
            <p>The below dashboard allows you to explore various destinations in Southeast Asia</p>
        </section>
        <section>
            <h2>Destinations</h2>
            <label for="max-budget">Maximum daily budget</label>
            <input id="max-budget" type="number" disabled>
            <div class="selected-info">
                <p class="selected-destination">No destination selected</p>
                <p class="selected-capital"></p>
                <p class="selected-budget"></p>
                <p class="selected-region"></p>   
            </div>
            <p class="destination-status" role = "status"></p>
            <div class="destination-box"></div>
        </section>
    </main>
    <footer>
        <p>My Travel Dashboard - 2026</p>
    </footer>
<script src="script.js"></script>
</body>

</html>
